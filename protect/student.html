                            var data = JSON.parse(decryptedData);
                            const contents = document.getElementById('contents');
                            contents.innerHTML = '';
                            contents.innerHTML += '<div style="height: 20;width: 100%;"></div>';
                            for (let i = 65; i <= 90; i++) {
                                var letter = String.fromCharCode(i);
                                if (data[letter]) {
                                    var text = data[letter][0];
                                    for (let j = 1; j < data[letter].length; j++) {
                                        text += " " + data[letter][j];
                                    }
                                    contents.innerHTML +=
                                        `<div class="box">
    <div class="title">
        <h1 style="position: relative;left: 20;">${letter}</h1>
    </div>
    <br style="clear: both;">
    <p class="pp">${text}</p>
</div>
<br style="height: 10;">`;

                                }
                            }
                        })
                        .catch(error => {
                            status.textContent = '解密失败,';
                            console.error(error);
                        });
                }
            });

        }
        window.onload = getDataFromUrl;
    </script>
</body>

</html>
