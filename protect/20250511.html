        function togglePwd() {
            const input = document.getElementById('password');
            const eyeImg = document.getElementById('eyeImg');
            if (input.type === 'password') {
                input.type = 'text';
                eyeImg.src = imgSrcEyeOpened;
            } else {
                input.type = 'password';
                eyeImg.src = imgSrcEyeClosed;
            }
        }
        function getDataFromUrl() {
            const passwordArea = document.getElementById('password');
            const params = new URLSearchParams(window.location.search);
            const password = params.get('password');
            if (password) {
                passwordArea.value = password;
                decryptData();
            }
        }
        function decryptData() {
            const password = document.getElementById('password').value;
            const outputEncrypted = document.getElementById('output-encrypted');
            const status = document.getElementById('status');
            window.history.replaceState(null, '', `?password=${encodeURIComponent(password)}`);
            if (!password) {
                status.textContent = '请输入密码';
                return;
            }
            window.CryptoLib.sha256(password).then(hash => {
                if (hash !== passwordHash) {
                    status.textContent = '密码错误';
                    return;
                }
                else {
                    window.CryptoLib.decryptAES(encryptData, password)
                        .then(decryptedData => {
                            status.textContent = '解密成功';
                            var data = JSON.parse(decryptedData);
                            document.getElementById('content-title').textContent = data.title;
                            document.getElementById('content').innerHTML = '<p style="width: 85%;" class="center">' + data.content + '</p>';
                        })
                        .catch(error => {
                            status.textContent = '密码错误或数据损坏';
                        });
                }
            });

        }
        window.onload = getDataFromUrl;
